<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <section class="converter-card">

            <div class="heading">
                <div class="thermometer">°</div>
                <p class="eyebrow">SMART TOOL</p>
                <h1>Temperature<br><span>Converter</span></h1>
                <p class="subtitle">Convert temperatures quickly and accurately.</p>
            </div>

            <div class="converter-form">

                <div class="input-group">
                    <label for="temperature">Temperature</label>

                    <div class="input-wrapper">
                        <input
                            type="number"
                            id="temperature"
                            placeholder="Enter temperature"
                            step="any"
                        >
                        <span class="input-symbol">°</span>
                    </div>

                    <p class="error-message" id="errorMessage"></p>
                </div>

                <div class="input-group">
                    <label for="unit">Input Unit</label>

                    <div class="select-wrapper">
                        <select id="unit">
                            <option value="celsius">Celsius (°C)</option>
                            <option value="fahrenheit">Fahrenheit (°F)</option>
                            <option value="kelvin">Kelvin (K)</option>
                        </select>
                    </div>
                </div>

                <button id="convertBtn" type="button">
                    <span>Convert Temperature</span>
                    <span class="arrow">→</span>
                </button>

            </div>

            <div class="results" id="results">

                <div class="results-heading">
                    <span>RESULTS</span>
                    <span class="line"></span>
                </div>

                <div class="result-grid">

                    <div class="result-card">
                        <div class="result-top">
                            <span class="result-unit">CELSIUS</span>
                            <span class="unit-icon">°C</span>
                        </div>
                        <strong id="celsiusResult">--</strong>
                    </div>

                    <div class="result-card">
                        <div class="result-top">
                            <span class="result-unit">FAHRENHEIT</span>
                            <span class="unit-icon">°F</span>
                        </div>
                        <strong id="fahrenheitResult">--</strong>
                    </div>

                    <div class="result-card">
                        <div class="result-top">
                            <span class="result-unit">KELVIN</span>
                            <span class="unit-icon">K</span>
                        </div>
                        <strong id="kelvinResult">--</strong>
                    </div>

                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
